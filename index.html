<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeForge — Speed Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: #23232d;
    --accent: #7c6aff;
    --accent2: #a78bfa;
    --accent-glow: rgba(124,106,255,0.18);
    --green: #22d3a4;
    --red: #ff5f7e;
    --yellow: #ffd166;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --dim: #3a3a4a;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content:'';
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(124,106,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none;
  }
  body::after {
    content:'';
    position:fixed;
    top:-20%; left:50%; transform:translateX(-50%);
    width:700px; height:500px;
    background: radial-gradient(ellipse, rgba(124,106,255,0.12) 0%, transparent 70%);
    pointer-events:none; z-index:0;
  }
  .app {
    position:relative; z-index:1;
    max-width: 900px;
    margin:0 auto;
    padding: 28px 20px 60px;
    /* always LTR layout for the app shell */
    direction: ltr;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family:'JetBrains Mono', monospace;
    font-size:1.1rem; font-weight:700;
    letter-spacing:-0.5px; color: var(--text);
  }
  .logo span { color:var(--accent); }
  .header-controls { display:flex; gap:8px; align-items:center; }
  .lang-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    font-size:0.8rem;
    font-family:'Space Grotesk', sans-serif;
    cursor:pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .lang-btn.active, .lang-btn:hover {
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-glow);
  }
  .stats-bar {
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:12px; margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    position:relative; overflow:hidden;
    transition: border-color 0.3s;
  }
  .stat-card::before {
    content:'';
    position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity:0; transition: opacity 0.3s;
  }
  .stat-card.active::before { opacity:1; }
  .stat-card.active { border-color: var(--accent); }
  .stat-label {
    font-size:0.7rem; text-transform:uppercase;
    letter-spacing:1.5px; color:var(--muted);
    font-weight:500; margin-bottom:6px;
  }
  .stat-value {
    font-family:'JetBrains Mono', monospace;
    font-size:2rem; font-weight:700;
    color: var(--text); line-height:1;
  }
  .stat-unit { font-size:0.7rem; color:var(--muted); margin-top:4px; font-weight:400; }
  #wpm-val { color:var(--accent); }
  #acc-val { color:var(--green); }
  #timer-val { color:var(--yellow); }

  .settings-row {
    display:flex; gap:8px; align-items:center;
    margin-bottom: 20px; flex-wrap:wrap;
    direction: ltr; /* always LTR for settings */
  }
  .settings-label {
    font-size:0.75rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px;
    margin-right:2px;
  }
  .pill-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px; border-radius: 50px;
    font-size:0.8rem; font-family:'Space Grotesk', sans-serif;
    cursor:pointer; transition: all 0.2s; font-weight:500;
  }
  .pill-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill-btn:hover:not(.active) { border-color:var(--accent); color:var(--accent); }
  .settings-sep { width:1px; height:22px; background:var(--border); margin:0 4px; }

  /* Text display */
  .text-display-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px; margin-bottom: 16px;
    position:relative; min-height: 130px;
    transition: border-color 0.3s;
    cursor: text;
    overflow: hidden;
  }
  .text-display-wrap.focused { border-color: var(--accent); }
  .text-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.15rem; line-height: 2;
    color: var(--dim); user-select:none;
    letter-spacing: 0.3px;
    direction: ltr; /* default; overridden for FA */
    text-align: left;
    word-break: break-word;
  }
  /* FA mode overrides for text only */
  .fa-text {
    font-family: 'Vazirmatn', 'Tahoma', 'Arial', sans-serif !important;
    direction: rtl !important;
    text-align: right !important;
    letter-spacing: 0 !important;
  }
  .text-display .char { display:inline; position:relative; }
  .text-display .char.correct { color: var(--text); }
  .text-display .char.wrong { color: var(--red); background: rgba(255,95,126,0.12); border-radius:3px; }
  .text-display .char.current { color: var(--accent); position:relative; }
  .text-display .char.current::after {
    content:'';
    position:absolute;
    bottom: -2px; left:0;
    width:100%; height:2px;
    background:var(--accent); border-radius:2px;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .cursor-hint {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:0.8rem; color:var(--muted);
    text-align:center; pointer-events:none;
    transition: opacity 0.3s;
    white-space: nowrap;
    width: 100%;
  }
  .cursor-hint .hint-key {
    display:inline-block;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:5px; padding:2px 8px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem; margin:0 3px;
  }

  /* Hidden real input */
  #type-input {
    position: fixed; opacity:0; pointer-events:none;
    top:0; left:0; width:1px; height:1px;
    font-size:16px; /* prevent iOS zoom */
  }

  .controls { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .restart-btn {
    display:flex; align-items:center; gap:8px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 10px 22px;
    border-radius: var(--radius-sm); font-size:0.85rem;
    font-family:'Space Grotesk', sans-serif;
    cursor:pointer; transition: all 0.2s; font-weight:500;
    white-space: nowrap;
  }
  .restart-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-glow); }
  .restart-btn svg { transition: transform 0.3s; flex-shrink:0; }
  .restart-btn:hover svg { transform: rotate(-90deg); }

  .progress-bar { flex:1; height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; }
  .progress-fill {
    height:100%; background:linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius:2px; width:0%; transition: width 0.3s;
  }

  #results {
    display:none; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px; margin-top: 28px;
    animation: fadeUp 0.4s ease;
    direction: ltr;
  }
  #results.show { display:block; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .results-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  .results-title { font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; color:var(--muted); }
  .rating-badge {
    font-family:'JetBrains Mono', monospace; font-size:0.8rem;
    font-weight:700; padding:5px 14px; border-radius:50px; border:1px solid; letter-spacing:1px;
  }
  .rating-godlike { color:#ffd166; border-color:#ffd166; background:rgba(255,209,102,0.1); }
  .rating-expert  { color:#a78bfa; border-color:#a78bfa; background:rgba(167,139,250,0.1); }
  .rating-fast    { color:#22d3a4; border-color:#22d3a4; background:rgba(34,211,164,0.1); }
  .rating-avg     { color:#7c6aff; border-color:#7c6aff; background:rgba(124,106,255,0.1); }
  .rating-slow    { color:#ff5f7e; border-color:#ff5f7e; background:rgba(255,95,126,0.1); }
  .results-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
  .res-card { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; text-align:center; }
  .res-card .res-val { font-family:'JetBrains Mono', monospace; font-size:1.6rem; font-weight:700; color:var(--text); }
  .res-card .res-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-top:4px; }
  .mistakes-section h3 { font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; color:var(--muted); margin-bottom:12px; }
  .mistake-list { display:flex; flex-wrap:wrap; gap:8px; }
  .mistake-tag { background:rgba(255,95,126,0.1); border:1px solid rgba(255,95,126,0.3); border-radius:6px; padding:4px 12px; font-family:'JetBrains Mono', monospace; font-size:0.85rem; color:var(--red); }
  .no-mistakes { color:var(--green); font-size:0.85rem; }
  .wpm-chart-wrap { margin-bottom:24px; }
  .wpm-chart-wrap h3 { font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; color:var(--muted); margin-bottom:12px; }
  #wpm-chart { width:100%; height:80px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border); }
  .tips-section { margin-top:24px; background:rgba(124,106,255,0.06); border:1px solid rgba(124,106,255,0.15); border-radius:var(--radius-sm); padding:16px 20px; }
  .tips-section h3 { font-size:0.7rem; text-transform:uppercase; letter-spacing:2px; color:var(--accent2); margin-bottom:10px; }
  .tips-list { list-style:none; }
  .tips-list li { font-size:0.82rem; color:var(--muted); padding:4px 0; display:flex; align-items:flex-start; gap:8px; }
  .tips-list li::before { content:'→'; color:var(--accent); font-family:'JetBrains Mono', monospace; font-size:0.75rem; flex-shrink:0; margin-top:1px; }
  .keyboard-hint { text-align:center; font-size:0.72rem; color:var(--muted); margin-top:14px; }
  .keyboard-hint kbd { background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:2px 7px; font-family:'JetBrains Mono', monospace; font-size:0.7rem; color:var(--text); margin:0 2px; }
  .finished-overlay {
    position:absolute; inset:0; background:rgba(10,10,15,0.85); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 0.3s;
  }
  .finished-overlay.show { opacity:1; pointer-events:auto; }
  .finished-msg { font-family:'JetBrains Mono', monospace; font-size:0.9rem; color:var(--accent); letter-spacing:2px; text-transform:uppercase; }

  @media(max-width:600px) {
    .stats-bar { gap:8px; }
    .stat-value { font-size:1.5rem; }
    .results-grid { grid-template-columns:repeat(2,1fr); }
    .text-display { font-size:0.95rem; }
    header { flex-wrap:wrap; gap:10px; }
    .settings-row { gap:6px; }
  }
</style>
</head>
<body>

<!-- Hidden input always in LTR so browser IME doesn't flip layout -->
<input id="type-input" type="text"
  autocomplete="off" autocorrect="off"
  autocapitalize="off" spellcheck="false"
  inputmode="text">

<div class="app">
  <header>
    <div class="logo">Type<span>Forge</span></div>
    <div class="header-controls">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btn-fa" onclick="setLang('fa')">FA</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card" id="card-timer">
      <div class="stat-label" id="lbl-time">Time Left</div>
      <div class="stat-value" id="timer-val">60</div>
      <div class="stat-unit">seconds</div>
    </div>
    <div class="stat-card active" id="card-wpm">
      <div class="stat-label" id="lbl-speed">Speed</div>
      <div class="stat-value" id="wpm-val">0</div>
      <div class="stat-unit">WPM</div>
    </div>
    <div class="stat-card" id="card-acc">
      <div class="stat-label" id="lbl-acc">Accuracy</div>
      <div class="stat-value" id="acc-val">—</div>
      <div class="stat-unit">percent</div>
    </div>
  </div>

  <div class="settings-row">
    <span class="settings-label" id="lbl-mode">Mode</span>
    <button class="pill-btn active" data-mode="words"     onclick="setMode('words')">Words</button>
    <button class="pill-btn"        data-mode="sentences" onclick="setMode('sentences')">Sentences</button>
    <button class="pill-btn"        data-mode="numbers"   onclick="setMode('numbers')">Numbers</button>
    <div class="settings-sep"></div>
    <span class="settings-label" id="lbl-time2">Time</span>
    <button class="pill-btn" data-time="30"  onclick="setTime(30)">30s</button>
    <button class="pill-btn active" data-time="60"  onclick="setTime(60)">60s</button>
    <button class="pill-btn" data-time="120" onclick="setTime(120)">120s</button>
  </div>

  <div class="text-display-wrap" id="display-wrap" onclick="focusInput()">
    <div class="text-display" id="text-display"></div>
    <div class="cursor-hint" id="cursor-hint">
      Click here or press <span class="hint-key">Space</span> to start typing
    </div>
    <div class="finished-overlay" id="finished-overlay">
      <div class="finished-msg">✓ Test Complete</div>
    </div>
  </div>

  <div class="controls">
    <button class="restart-btn" id="restart-main" onclick="restart()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
      </svg>
      <span id="btn-restart-lbl">Restart</span>
    </button>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div class="keyboard-hint">
    Press <kbd>Tab</kbd> to restart · <kbd>Esc</kbd> to reset
  </div>

  <div id="results">
    <div class="results-header">
      <div class="results-title" id="lbl-results">Test Results</div>
      <div class="rating-badge" id="rating-badge"></div>
    </div>
    <div class="wpm-chart-wrap">
      <h3 id="lbl-chart">WPM Over Time</h3>
      <canvas id="wpm-chart"></canvas>
    </div>
    <div class="results-grid">
      <div class="res-card"><div class="res-val" id="res-wpm">0</div><div class="res-label">WPM</div></div>
      <div class="res-card"><div class="res-val" id="res-raw">0</div><div class="res-label" id="lbl-raw">Raw WPM</div></div>
      <div class="res-card"><div class="res-val" id="res-acc">0%</div><div class="res-label" id="lbl-acc2">Accuracy</div></div>
      <div class="res-card"><div class="res-val" id="res-chars">0</div><div class="res-label" id="lbl-chars">Characters</div></div>
    </div>
    <div class="mistakes-section">
      <h3 id="lbl-mistakes">Mistakes</h3>
      <div class="mistake-list" id="mistake-list"></div>
    </div>
    <div class="tips-section">
      <h3 id="lbl-tips">Practice Tips</h3>
      <ul class="tips-list" id="tips-list"></ul>
    </div>
    <div style="margin-top:20px; text-align:center;">
      <button class="restart-btn" style="margin:0 auto; padding:12px 32px;" onclick="restart()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
        </svg>
        <span id="btn-tryagain-lbl">Try Again</span>
      </button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  Word / Sentence banks
// ══════════════════════════════════════════════
const WORDS_EN = ["the","be","to","of","and","a","in","that","have","it","for","not","on","with","he","as","you","do","at","this","but","his","by","from","they","we","say","her","she","or","an","will","my","one","all","would","there","their","what","so","up","out","if","about","who","get","which","go","me","when","make","can","like","time","no","just","him","know","take","people","into","year","your","good","some","could","them","see","other","than","then","now","look","only","come","its","over","think","also","back","after","use","two","how","our","work","first","well","way","even","new","want","because","any","these","give","day","most","us","great","between","need","large","often","hand","high","place","hold","today","old","real","few","open","seem","together","next","white","children","begin","walk","example","paper","group","always","music","those","both","mark","book","letter","until","river","car","feet","care","second","enough","plain","girl","young","ready","above","ever","red","list","feel","talk","bird","soon","body","dog","family","leave","song","door","product","black","short","class","wind","question","happen","complete","ship","area","half","rock","order","fire","south","problem","piece","told","knew","pass","since","top","whole","king","space","heard","best","hour","better","true","during","hundred"];

const WORDS_FA = ["از","به","در","که","این","را","با","است","می","برای","آن","یک","هم","اما","تا","اگر","شد","بود","کرد","خود","ما","او","آنها","یا","نه","شما","من","همه","مثل","فقط","باید","بین","چون","وقتی","دیگر","چه","داد","گفت","شده","بیشتر","خوب","بزرگ","نمی","چند","سال","روز","مردم","کار","وقت","چیز","جدید","بار","راه","خانه","زندگی","دست","چشم","زمان","کتاب","شهر","فکر","قدیم","آب","نام","شب","دوست","درست","ایران","سر","پیش","تنها","هنوز","باشد","پدر","مادر","برادر","خواهر","دختر","پسر","کودک","مدرسه","معلم","کلاس","درس","نوشتن","خواندن","قلب","عشق","آرزو","امید","صبر","خواست","رفت","آمد","دید","گرفت","ماند","شناخت","توانست","خورد","نوشت","خواند","برگشت","انداخت","حرف","جمله","کلمه","صفحه","کمک","نوع","رنگ","زیبا","تازه","مهم"];

const SENTENCES_EN = [
  "The quick brown fox jumps over the lazy dog.",
  "Practice makes perfect when it comes to typing speed.",
  "Speed and accuracy are both important in typing tests.",
  "Every great typist started by learning the home row keys.",
  "Focus on accuracy first and speed will follow naturally.",
  "Touch typing allows you to type without looking at the keys.",
  "Consistent practice is the key to improving your typing speed.",
  "The best way to improve is to type every single day.",
  "Keep your fingers on the home row for maximum efficiency.",
  "A clean desk and good posture help you type better.",
  "Learning to type fast is a skill that pays off forever.",
  "Start slow and build up your speed over time with patience."
];

const SENTENCES_FA = [
  "تایپ کردن یک مهارت مهم در دنیای امروز است.",
  "تمرین مداوم باعث افزایش سرعت و دقت تایپ می‌شود.",
  "هر روز کمی تمرین کنید تا پیشرفت کنید.",
  "انگشتان خود را روی ردیف اصلی کیبورد نگه دارید.",
  "دقت در تایپ مهم‌تر از سرعت در ابتدای کار است.",
  "نگاه نکردن به کیبورد هنگام تایپ یک مهارت ارزشمند است.",
  "فارسی تایپ کردن نیازمند تمرین منظم و صبر دارد.",
  "با تمرین روزانه می‌توانید سرعت تایپ خود را دو برابر کنید.",
];

// ══════════════════════════════════════════════
//  i18n labels
// ══════════════════════════════════════════════
const I18N = {
  en: {
    hint: 'Click here or press <span class="hint-key">Space</span> to start typing',
    restart: 'Restart', tryagain: 'Try Again',
    results: 'Test Results', chart: 'WPM Over Time',
    mistakes: 'Mistakes', tips: 'Practice Tips',
    raw: 'Raw WPM', chars: 'Characters',
    noMistakes: '✓ Perfect — no mistakes!',
    tip1: 'Slow down a bit — accuracy under 90% means too many errors.',
    tip2: 'Try 15 min daily: 5 min words, 5 min sentences, 5 min numbers.',
    tip3: 'Focus on problem keys. Identify which characters slow you down.',

    tip5a: 'You made $n mistake types — practice those specific characters.',
    tip6: 'Keep wrists relaxed and fingers curved over the home row.',
    ratings: { godlike:'GOD MODE', expert:'EXPERT', fast:'FAST', avg:'AVERAGE', slow:'BEGINNER' },
    modeLbl: 'Mode', timeLbl: 'Time', timeName: 'Time Left', speedName: 'Speed', accName: 'Accuracy',
  },
  fa: {
    hint: 'اینجا کلیک کنید یا <span class="hint-key">Space</span> را فشار دهید',
    restart: 'شروع مجدد', tryagain: 'دوباره امتحان',
    results: 'نتایج تست', chart: 'سرعت در طول زمان',
    mistakes: 'اشتباهات', tips: 'نکات تمرینی',
    raw: 'WPM خام', chars: 'کاراکترها',
    noMistakes: '✓ عالی — بدون اشتباه!',
    tip1: 'کمی آهسته‌تر بنویسید — دقت زیر ۹۰٪ یعنی اشتباه زیاد.',
    tip2: 'روزی ۱۵ دقیقه تمرین کنید: ۵ دقیقه کلمه، ۵ جمله، ۵ عدد.',
    tip3: 'روی حروف ضعیف تمرکز کنید و کاراکترهای مشکل‌دار را تمرین دهید.',
    tip4: 'عالی هستید! متن‌های سخت‌تر یا زمان بیشتر را امتحان کنید.',
    tip5a: 'شما $n نوع اشتباه داشتید — آن کاراکترها را تمرین کنید.',
    tip6: 'مچ دست را آرام نگه دارید و انگشتان خمیده روی ردیف اصلی.',
    ratings: { godlike:'حرفه‌ای مطلق', expert:'خبره', fast:'سریع', avg:'متوسط', slow:'مبتدی' },
    modeLbl: 'حالت', timeLbl: 'زمان', timeName: 'زمان باقی', speedName: 'سرعت', accName: 'دقت',
  }
};

// ══════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════
let lang = 'en';
let mode = 'words';
let totalTime = 60;
let timer = null;
let timeLeft = 60;
let started = false;
let finished = false;
let currentText = '';
let typedIndex = 0;
let typedChars = 0;
let correctChars = 0;
let mistakeSet = new Set();
let wpmHistory = [];
let wpmInterval = null;
// Buffer for FA composing
let pendingBuffer = '';

// ══════════════════════════════════════════════
//  Text generation
// ══════════════════════════════════════════════
function generateText() {
  if (mode === 'sentences') {
    const pool = lang === 'fa' ? SENTENCES_FA : SENTENCES_EN;
    let result = '';
    while (result.length < 400) {
      result += (result ? ' ' : '') + pool[Math.floor(Math.random()*pool.length)];
    }
    return result.trim();
  }
  if (mode === 'numbers') {
    let result = '';
    for (let i=0; i<94; i++) {
      if (i>0 && i%5===0) result += ' ';
      result += Math.floor(Math.random()*10);
    }
    return result;
  }
  const pool = lang === 'fa' ? WORDS_FA : WORDS_EN;
  let words = [];
  while (words.join(' ').length < 400) {
    words.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  return words.join(' ');
}

function appendMoreText() {
  const extra = generateText();
  const startIdx = currentText.length;
  currentText += ' ' + extra;
  const display = document.getElementById('text-display');
  for (let i = startIdx; i < currentText.length; i++) {
    const s = document.createElement('span');
    s.className = 'char';
    s.textContent = currentText[i] === ' ' ? '\u00A0' : currentText[i];
    s.id = 'c' + i;
    display.appendChild(s);
  }
}

function renderText() {
  const display = document.getElementById('text-display');
  display.innerHTML = '';
  // Apply FA font/direction class on the display div
  if (lang === 'fa') {
    display.classList.add('fa-text');
  } else {
    display.classList.remove('fa-text');
  }
  for (let i=0; i<currentText.length; i++) {
    const span = document.createElement('span');
    span.className = 'char' + (i===0 ? ' current' : '');
    span.textContent = currentText[i] === ' ' ? '\u00A0' : currentText[i];
    span.id = 'c' + i;
    display.appendChild(span);
  }
}

// ══════════════════════════════════════════════
//  Language & mode switching
// ══════════════════════════════════════════════
function applyI18n() {
  const t = I18N[lang];
  document.getElementById('cursor-hint').innerHTML = t.hint;
  document.getElementById('btn-restart-lbl').textContent = t.restart;
  document.getElementById('btn-tryagain-lbl').textContent = t.tryagain;
  document.getElementById('lbl-results').textContent = t.results;
  document.getElementById('lbl-chart').textContent = t.chart;
  document.getElementById('lbl-mistakes').textContent = t.mistakes;
  document.getElementById('lbl-tips').textContent = t.tips;
  document.getElementById('lbl-raw').textContent = t.raw;
  document.getElementById('lbl-chars').textContent = t.chars;
  document.getElementById('lbl-mode').textContent = t.modeLbl;
  document.getElementById('lbl-time2').textContent = t.timeLbl;
  document.getElementById('lbl-time').textContent = t.timeName;
  document.getElementById('lbl-speed').textContent = t.speedName;
  document.getElementById('lbl-acc').textContent = t.accName;
  document.getElementById('lbl-acc2').textContent = t.accName;
}

function setLang(l) {
  lang = l;
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-fa').classList.toggle('active', l==='fa');
  applyI18n();
  restart();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  restart();
}

function setTime(t) {
  totalTime = t;
  timeLeft = t;
  document.querySelectorAll('[data-time]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.time) === t);
  });
  restart();
}

function focusInput() {
  const inp = document.getElementById('type-input');
  inp.focus();
  // On mobile, place cursor at end
  inp.setSelectionRange(inp.value.length, inp.value.length);
}

// ══════════════════════════════════════════════
//  Stats
// ══════════════════════════════════════════════
function getWPM() {
  if (!started) return 0;
  const elapsed = Math.max(1, totalTime - timeLeft);
  return Math.round((correctChars / 5) / (elapsed / 60));
}
function getRawWPM() {
  if (!started) return 0;
  const elapsed = Math.max(1, totalTime - timeLeft);
  return Math.round((typedChars / 5) / (elapsed / 60));
}
function getAccuracy() {
  if (typedChars === 0) return 100;
  return Math.round((correctChars / typedChars) * 100);
}
function updateStats() {
  document.getElementById('wpm-val').textContent = getWPM();
  document.getElementById('acc-val').textContent = started ? (getAccuracy() + '%') : '—';
  document.getElementById('timer-val').textContent = timeLeft;
  document.getElementById('progress-fill').style.width = (((totalTime - timeLeft) / totalTime) * 100) + '%';
}

// ══════════════════════════════════════════════
//  Timer
// ══════════════════════════════════════════════
function startTimer() {
  if (timer) return;
  timer = setInterval(() => {
    timeLeft--;
    updateStats();
    if (timeLeft <= 0) endTest();
  }, 1000);
  wpmInterval = setInterval(() => {
    wpmHistory.push(getWPM());
  }, 5000);
}

function endTest() {
  clearInterval(timer); timer = null;
  clearInterval(wpmInterval); wpmInterval = null;
  finished = true;
  document.getElementById('type-input').blur();
  document.getElementById('finished-overlay').classList.add('show');
  setTimeout(showResults, 600);
}

// ══════════════════════════════════════════════
//  Results
// ══════════════════════════════════════════════
function showResults() {
  const wpm = getWPM(), raw = getRawWPM(), acc = getAccuracy();
  const t = I18N[lang];

  document.getElementById('res-wpm').textContent = wpm;
  document.getElementById('res-raw').textContent = raw;
  document.getElementById('res-acc').textContent = acc + '%';
  document.getElementById('res-chars').textContent = correctChars + '/' + typedChars;

  const badge = document.getElementById('rating-badge');
  let cls;
  if      (wpm >= 120) { badge.textContent = t.ratings.godlike; cls = 'rating-godlike'; }
  else if (wpm >= 80)  { badge.textContent = t.ratings.expert;  cls = 'rating-expert'; }
  else if (wpm >= 60)  { badge.textContent = t.ratings.fast;    cls = 'rating-fast'; }
  else if (wpm >= 40)  { badge.textContent = t.ratings.avg;     cls = 'rating-avg'; }
  else                 { badge.textContent = t.ratings.slow;    cls = 'rating-slow'; }
  badge.className = 'rating-badge ' + cls;

  const ml = document.getElementById('mistake-list');
  ml.innerHTML = '';
  if (mistakeSet.size === 0) {
    ml.innerHTML = '<span class="no-mistakes">' + t.noMistakes + '</span>';
  } else {
    [...mistakeSet].slice(0,20).forEach(ch => {
      const tag = document.createElement('span');
      tag.className = 'mistake-tag';
      tag.textContent = ch === ' ' ? '·space·' : '"' + ch + '"';
      ml.appendChild(tag);
    });
  }

  const tips = [];
  if (acc < 90) tips.push(t.tip1);
  if (wpm < 40) tips.push(t.tip2);
  if (wpm >= 40 && wpm < 60) tips.push(t.tip3);
  if (wpm >= 60) tips.push(t.tip4);
  if (mistakeSet.size > 5) tips.push(t.tip5a.replace('$n', mistakeSet.size));
  tips.push(t.tip6);
  document.getElementById('tips-list').innerHTML = tips.map(tp => '<li>' + tp + '</li>').join('');

  drawChart();
  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({ behavior:'smooth', block:'start' });
}

function drawChart() {
  const canvas = document.getElementById('wpm-chart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  ctx.scale(dpr, dpr);
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  const data = wpmHistory.length >= 2 ? wpmHistory : [0, getWPM()];
  const max = Math.max(...data, 1);
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i=0; i<=4; i++) {
    const y = (H-20)*(1-i/4)+10;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  const grad = ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,'#7c6aff'); grad.addColorStop(1,'#a78bfa');
  ctx.beginPath();
  data.forEach((v,i) => {
    const x=(i/(data.length-1||1))*W, y=H-20-((v/max)*(H-30));
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle=grad; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  // fill
  const lastX=(data.length-1)/(data.length-1||1)*W;
  const lastY=H-20-((data[data.length-1]/max)*(H-30));
  ctx.lineTo(lastX,H-20); ctx.lineTo(0,H-20); ctx.closePath();
  const fill=ctx.createLinearGradient(0,0,0,H);
  fill.addColorStop(0,'rgba(124,106,255,0.3)'); fill.addColorStop(1,'rgba(124,106,255,0)');
  ctx.fillStyle=fill; ctx.fill();
  data.forEach((v,i) => {
    const x=(i/(data.length-1||1))*W, y=H-20-((v/max)*(H-30));
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle='#a78bfa'; ctx.fill();
  });
}

// ══════════════════════════════════════════════
//  Core character processing
// ══════════════════════════════════════════════
function processChar(ch) {
  if (finished || typedIndex >= currentText.length) return;

  const expected = currentText[typedIndex];
  const span = document.getElementById('c' + typedIndex);

  // Remove current marker from current char
  if (span) span.classList.remove('current');

  if (ch === expected) {
    correctChars++;
    if (span) span.classList.add('correct');
  } else {
    mistakeSet.add(expected);
    if (span) span.classList.add('wrong');
  }
  typedChars++;
  typedIndex++;

  // Mark next char as current
  const next = document.getElementById('c' + typedIndex);
  if (next) {
    next.classList.add('current');
    next.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Load more text if near end
  if (typedIndex >= currentText.length - 20) {
    appendMoreText();
  }

  updateStats();
}

function processBackspace() {
  if (finished || typedIndex === 0) return;
  typedIndex--;
  const span = document.getElementById('c' + typedIndex);
  const next = document.getElementById('c' + (typedIndex + 1));
  if (next) next.classList.remove('current');
  if (span) {
    const wasCorrect = span.classList.contains('correct');
    span.classList.remove('correct', 'wrong');
    span.classList.add('current');
    if (wasCorrect) correctChars = Math.max(0, correctChars - 1);
  }
  typedChars = Math.max(0, typedChars - 1);
  updateStats();
}

// ══════════════════════════════════════════════
//  Input event handling
//  KEY FIX: use keydown for real-time chars instead
//  of 'input' event, which fires too late for FA IME.
//  We handle composition events separately.
// ══════════════════════════════════════════════
const inp = document.getElementById('type-input');
let isComposing = false;

inp.addEventListener('compositionstart', () => { isComposing = true; });

inp.addEventListener('compositionend', (e) => {
  isComposing = false;
  // The composed string (e.g. full Arabic/FA word syllable)
  const composed = e.data || '';
  inp.value = ''; // clear
  if (!started && composed.length > 0) {
    started = true;
    document.getElementById('cursor-hint').style.opacity = '0';
    document.getElementById('display-wrap').classList.add('focused');
    startTimer();
  }
  for (const ch of composed) {
    processChar(ch);
  }
});

inp.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); restart(); return; }
  if (e.key === 'Escape') { restart(); return; }
  if (isComposing) return; // let compositionend handle FA

  if (e.key === 'Backspace') {
    e.preventDefault();
    processBackspace();
    inp.value = '';
    return;
  }
});

inp.addEventListener('input', (e) => {
  if (isComposing) return; // handled by compositionend
  const val = inp.value;
  if (!val) return;

  if (!started) {
    started = true;
    document.getElementById('cursor-hint').style.opacity = '0';
    document.getElementById('display-wrap').classList.add('focused');
    startTimer();
  }

  // Process every character in the buffered value
  for (const ch of val) {
    processChar(ch);
  }
  inp.value = '';
});

// Space key focus
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && !started && !finished && document.activeElement !== inp) {
    e.preventDefault();
    focusInput();
  }
});

// ══════════════════════════════════════════════
//  Restart
// ══════════════════════════════════════════════
function restart() {
  clearInterval(timer); timer = null;
  clearInterval(wpmInterval); wpmInterval = null;
  started = false; finished = false; isComposing = false;
  timeLeft = totalTime;
  typedChars = 0; correctChars = 0; typedIndex = 0;
  mistakeSet.clear(); wpmHistory = [];
  currentText = generateText();
  renderText();
  document.getElementById('cursor-hint').style.opacity = '1';
  document.getElementById('cursor-hint').innerHTML = I18N[lang].hint;
  document.getElementById('display-wrap').classList.remove('focused');
  document.getElementById('finished-overlay').classList.remove('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('progress-fill').style.width = '0%';
  inp.value = '';
  updateStats();
  document.getElementById('acc-val').textContent = '—';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(focusInput, 100);
}

// ══════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════
applyI18n();
restart();
</script>
